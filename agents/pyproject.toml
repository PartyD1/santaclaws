[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mainstreet-agents"
version = "0.1.0"
description = "NemoClaw claws for the Mainstreet hackathon demo."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "supabase>=2.0.0",
  "httpx>=0.27.0",
  "playwright>=1.40.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["agents*"]
