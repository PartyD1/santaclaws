<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Santa Claws Hackathon Thumbnail</title>
  <desc id="desc">A 3:2 Santa Claws project thumbnail showing autonomous AI agents turning leads into website mockups and outreach.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.42" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f3f46"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1035" cy="116" r="180" fill="#dcfce7" opacity="0.72"/>
  <circle cx="104" cy="672" r="210" fill="#fee2e2" opacity="0.8"/>
  <circle cx="520" cy="70" r="130" fill="#bae6fd" opacity="0.42"/>

  <g transform="translate(74 74)" filter="url(#shadow)">
    <rect width="1052" height="652" rx="34" fill="#ffffff"/>
    <rect x="1" y="1" width="1050" height="650" rx="33" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  </g>

  <g transform="translate(112 112)">
    <rect x="0" y="0" width="976" height="576" rx="26" fill="url(#panel)"/>
    <circle cx="916" cy="74" r="88" fill="#38bdf8" opacity="0.16"/>
    <circle cx="86" cy="498" r="118" fill="#ef4444" opacity="0.14"/>

    <g transform="translate(44 42)">
      <rect x="0" y="0" width="118" height="118" rx="24" fill="url(#red)"/>
      <path d="M33 79c14 17 39 18 53 1" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <path d="M30 42c20-25 53-25 58 3" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <circle cx="75" cy="53" r="8" fill="#fff"/>
      <path d="M82 14c8 4 17 14 19 28" fill="none" stroke="#fecaca" stroke-width="7" stroke-linecap="round"/>
      <path d="M99 33l19-12" fill="none" stroke="#fecaca" stroke-width="6" stroke-linecap="round"/>
      <text x="59" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff">SC</text>
    </g>

    <text x="44" y="214" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="900" fill="#ffffff" letter-spacing="-1">Santa Claws</text>
    <text x="48" y="272" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#bae6fd">AI agents for local-business growth</text>
    <text x="48" y="326" font-family="Inter, Arial, sans-serif" font-size="24" fill="#dbeafe">
      <tspan x="48" dy="0">Turns leads into live website mockups</tspan>
      <tspan x="48" dy="38">and personalized outreach.</tspan>
    </text>

    <g transform="translate(48 414)">
      <rect x="0" y="0" width="174" height="52" rx="14" fill="#ffffff" opacity="0.95"/>
      <text x="87" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">NemoClaw</text>
      <rect x="192" y="0" width="168" height="52" rx="14" fill="#dcfce7"/>
      <text x="276" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#14532d">Nemotron</text>
      <rect x="378" y="0" width="168" height="52" rx="14" fill="#fee2e2"/>
      <text x="462" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#7f1d1d">Supabase</text>
    </g>

    <g transform="translate(624 70)" filter="url(#softShadow)">
      <rect x="0" y="0" width="300" height="420" rx="24" fill="#f8fafc"/>
      <rect x="24" y="28" width="252" height="112" rx="18" fill="#fee2e2"/>
      <rect x="44" y="50" width="106" height="12" rx="6" fill="#991b1b"/>
      <rect x="44" y="76" width="184" height="16" rx="8" fill="#111827"/>
      <rect x="44" y="106" width="134" height="12" rx="6" fill="#475569"/>
      <rect x="24" y="164" width="116" height="80" rx="16" fill="#e0f2fe"/>
      <rect x="160" y="164" width="116" height="80" rx="16" fill="#dcfce7"/>
      <rect x="24" y="268" width="252" height="24" rx="12" fill="#e5e7eb"/>
      <rect x="24" y="310" width="252" height="24" rx="12" fill="#e5e7eb"/>
      <rect x="24" y="352" width="164" height="38" rx="14" fill="#0f172a"/>
      <text x="106" y="377" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Live mockup</text>
    </g>

    <g transform="translate(520 500)">
      <rect x="0" y="0" width="84" height="84" rx="20" fill="#fef3c7"/>
      <text x="42" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#92400e">R</text>
      <rect x="106" y="0" width="84" height="84" rx="20" fill="#dcfce7"/>
      <text x="148" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#166534">E</text>
      <rect x="212" y="0" width="84" height="84" rx="20" fill="#e0f2fe"/>
      <text x="254" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#075985">P</text>
      <rect x="318" y="0" width="84" height="84" rx="20" fill="#fee2e2"/>
      <text x="360" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#991b1b">C</text>
    </g>
  </g>
</svg>
